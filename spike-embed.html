<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Embed Spike (Phase 0)</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; padding: 1rem; max-width: 720px; margin: 0 auto; }
        input, button { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; }
        button { background: #fff; color: #000; font-weight: 600; cursor: pointer; }
        pre { background: #050505; padding: 1rem; border-radius: 8px; overflow: auto; font-size: 0.75rem; white-space: pre-wrap; }
        #embedHost { position: fixed; left: 0; top: 0; width: 658px; height: 70vh; max-height: 900px; opacity: 0.02; pointer-events: none; z-index: -1; border: 0; }
    </style>
</head>
<body>
    <h1>Phase 0: Embed Spike</h1>
    <p>Threads embed.js mounts a <strong>cross-origin iframe</strong>, not inline &lt;video&gt;. This spike tests oEmbed, embed URL, optional page fetch (CORS), and iframe mount.</p>
    <input id="url" placeholder="https://www.threads.com/@user/post/CODE" />
    <button id="run">Run spike on URL</button>
    <pre id="out">Ready.</pre>
    <iframe id="embedHost" title="embed spike" allow="autoplay; encrypted-media; fullscreen"></iframe>

    <script>
    (function () {
        const out = document.getElementById('out');
        const log = (msg) => { out.textContent += msg + '\n'; out.scrollTop = out.scrollHeight; };

        function permalinkFromHtml(html) {
            const m = html.match(/data-text-post-permalink="([^"]+)"/);
            return m ? m[1].replace(/&amp;/g, '&') : null;
        }

        function buildEmbedUrl(permalink) {
            const re = /^(.*?)\/?(\?.*|#|$)/;
            const m = re.exec(permalink);
            if (!m) return permalink;
            return m[1] + '/embed/' + (m[2] || '');
        }

        async function fetchOEmbed(postUrl) {
            const urls = [
                'https://graph.threads.net/v1.0/oembed?url=' + encodeURIComponent(postUrl),
                'https://graph.threads.com/oembed?url=' + encodeURIComponent(postUrl)
            ];
            for (const u of urls) {
                try {
                    const res = await fetch(u);
                    const data = await res.json();
                    if (data.html) return { data, endpoint: u };
                } catch (e) { log('oEmbed fail: ' + u); }
            }
            throw new Error('oEmbed failed');
        }

        function walkMedia(root) {
            const videos = [], images = [], iframes = [];
            function visit(node) {
                if (!node) return;
                if (node.nodeType === 1) {
                    const el = node;
                    if (el.tagName === 'VIDEO' && el.src) videos.push(el);
                    if (el.tagName === 'IMG' && el.src) images.push(el);
                    if (el.tagName === 'IFRAME' && el.src) iframes.push(el);
                    if (el.shadowRoot) visit(el.shadowRoot);
                    el.querySelectorAll('*').forEach(child => {
                        if (child.shadowRoot) visit(child.shadowRoot);
                    });
                }
                if (node.childNodes) node.childNodes.forEach(visit);
            }
            visit(root);
            return { videos, images, iframes };
        }

        async function testEmbedPageFetch(embedUrl) {
            try {
                const res = await fetch(embedUrl, { credentials: 'omit' });
                const text = await res.text();
                return { status: res.status, ok: res.ok, length: text.length, cors: 'pass', hasMp4: /\.mp4/i.test(text) };
            } catch (e) {
                return { status: 0, ok: false, cors: 'blocked', error: e.message };
            }
        }

        function waitForEmbed(iframe, timeoutMs) {
            return new Promise((resolve) => {
                const deadline = Date.now() + timeoutMs;
                const onMessage = (event) => {
                    if (!/threads\.(com|net)/.test(event.origin)) return;
                    if (typeof event.data === 'number' && event.data > 120) done();
                };
                const poll = setInterval(() => {
                    if (iframe.clientHeight > 120) done();
                    if (Date.now() > deadline) done();
                }, 400);
                const onLoad = () => setTimeout(done, 2500);
                function done() {
                    clearInterval(poll);
                    iframe.removeEventListener('load', onLoad);
                    window.removeEventListener('message', onMessage);
                    resolve();
                }
                iframe.addEventListener('load', onLoad);
                window.addEventListener('message', onMessage);
            });
        }

        document.getElementById('run').onclick = async function () {
            out.textContent = '';
            const postUrl = document.getElementById('url').value.trim();
            if (!postUrl) return;
            const result = {
                postUrl,
                l1_inline_dom: 'fail',
                l1_embed_iframe: 'fail',
                l2_permalink: 'fail',
                l3_embedPage_fetch: 'fail',
                tab_capture_api: typeof window.CropTarget !== 'undefined' && typeof MediaStreamTrack.prototype.cropTo === 'function' ? 'pass' : 'fail'
            };

            try {
                const { data: oembed, endpoint } = await fetchOEmbed(postUrl);
                log('oEmbed OK: ' + endpoint);

                const permalink = permalinkFromHtml(oembed.html);
                if (!permalink) throw new Error('No data-text-post-permalink in oEmbed');
                result.l2_permalink = 'pass';
                log('L2 permalink: ' + permalink);

                const embedUrl = buildEmbedUrl(permalink);
                log('Embed URL: ' + embedUrl);

                log('L3 fetch embed HTML...');
                const l3 = await testEmbedPageFetch(embedUrl);
                log('L3 embed page: ' + JSON.stringify(l3));
                result.l3_embedPage_fetch = l3.cors === 'blocked' ? 'cors_blocked' : (l3.hasMp4 ? 'pass' : 'fail');

                const host = document.getElementById('embedHost');
                host.src = embedUrl;
                log('Loading official embed iframe...');
                await waitForEmbed(host, 20000);
                log('Iframe height: ' + host.clientHeight + 'px');

                const { videos, images, iframes } = walkMedia(document.body);
                log('L1 inline DOM (parent): videos=' + videos.length + ' images=' + images.length + ' iframes=' + iframes.length);
                if (videos.length || images.length) result.l1_inline_dom = 'pass';
                if (iframes.some((f) => f.src && f.src.includes('/embed'))) result.l1_embed_iframe = 'pass';

                log('Note: embed.js replaces blockquote with a cross-origin iframe. Inline video/img in parent DOM is usually empty.');
                log('Tab capture API (Chrome 132+): ' + result.tab_capture_api);

                log('\n--- spike-results.json ---');
                log(JSON.stringify(result, null, 2));
            } catch (e) {
                log('Error: ' + e.message);
            }
        };
    })();
    </script>
</body>
</html>
