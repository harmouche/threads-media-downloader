<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Threads Media Downloader</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .app-card {
            background: #121212;
            border: 1px solid #222;
            padding: 1.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
        }
        h2 { margin: 0 0 0.25rem; font-size: 1.25rem; text-align: center; }
        .subtitle { color: #666; font-size: 0.8rem; text-align: center; margin: 0 0 1.25rem; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.35rem; }
        input[type="text"] {
            width: 100%;
            padding: 0.85rem 1rem;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }
        input[type="text"]:focus { outline: 2px solid #444; border-color: #555; }
        input[type="text"].invalid { border-color: #a33; }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #fff;
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover:not(:disabled) { background: #e5e5e5; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #progress-wrap { display: none; margin-top: 1rem; }
        #progress-bar { height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        #progress-fill { height: 100%; width: 0%; background: #fff; transition: width 0.3s ease; }
        #progress-label { font-size: 0.75rem; color: #888; margin-top: 0.35rem; }
        #log {
            margin-top: 1rem;
            color: #888;
            font-size: 0.75rem;
            font-family: ui-monospace, monospace;
            text-align: left;
            background: #050505;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            max-height: 220px;
            overflow-y: auto;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="app-card">
    <h2>Threads Media Downloader</h2>
    <p class="subtitle">100% browser · no backend · no install</p>
    <label for="threadsUrl">Threads post URL</label>
    <input type="text" id="threadsUrl" placeholder="https://www.threads.com/@user/post/ABC123" autocomplete="off" />
    <button id="actionBtn" type="button">Download</button>
    <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-label"></div>
    </div>
    <div id="log"></div>
</div>

<script type="module">
import { downloadPost } from './lib/threads-downloader.esm.js';

let busy = false;
const $ = (id) => document.getElementById(id);

function log(msg) {
    const box = $('log');
    box.style.display = 'block';
    box.innerHTML += '&gt; ' + msg + '<br>';
    box.scrollTop = box.scrollHeight;
}

function setProgress(pct, label) {
    $('progress-wrap').style.display = 'block';
    $('progress-fill').style.width = Math.min(100, pct) + '%';
    $('progress-label').textContent = label || '';
}

function resetUI() {
    $('progress-wrap').style.display = 'none';
    $('progress-fill').style.width = '0%';
    $('actionBtn').disabled = false;
    busy = false;
}

$('actionBtn').addEventListener('click', async () => {
    if (busy) return;
    const url = $('threadsUrl').value.trim();
    if (!url) {
        alert('Enter a Threads post URL');
        return;
    }
    if (location.protocol === 'file:') {
        alert('Open over HTTPS, e.g. https://harmouche.github.io/threads-media-downloader/');
        return;
    }

    busy = true;
    $('actionBtn').disabled = true;
    $('log').innerHTML = '';
    $('log').style.display = 'block';
    $('threadsUrl').classList.remove('invalid');
    log('Starting...');

    try {
        const result = await downloadPost(url, {
            onProgress: (pct, label) => {
                setProgress(pct, label);
                if (label) log(label);
            },
        });
        log('Saved as ' + result.filename);
    } catch (err) {
        log('Error: ' + err.message);
        if (/Invalid URL/i.test(err.message)) $('threadsUrl').classList.add('invalid');
    } finally {
        resetUI();
    }
});
</script>

</body>
</html>
