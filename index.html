<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>Threads Media Downloader</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            margin: 0;
            padding: 1rem;
            min-height: 100vh;
        }
        .wrap { max-width: 520px; margin: 0 auto; }
        h1 { font-size: 1.35rem; margin: 0 0 0.25rem; text-align: center; }
        .sub { color: #666; font-size: 0.78rem; text-align: center; margin: 0 0 1rem; }
        .privacy { color: #555; font-size: 0.7rem; text-align: center; margin: 0 0 1rem; line-height: 1.4; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.35rem; }
        input[type="text"] {
            width: 100%;
            padding: 0.85rem 1rem;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }
        input:focus { outline: 2px solid #444; border-color: #555; }
        input.invalid { border-color: #a33; }
        input:disabled, button:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn {
            width: 100%;
            padding: 0.85rem;
            background: #fff;
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .btn.secondary { background: #222; color: #fff; border: 1px solid #333; }
        .btn.sm { width: auto; padding: 0.5rem 0.75rem; font-size: 0.75rem; margin: 0.25rem 0.25rem 0 0; }
        #turnstile { display: flex; justify-content: center; margin: 0.75rem 0; min-height: 0; }
        #results { display: none; margin-top: 1rem; }
        .card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .card h3 { margin: 0 0 0.5rem; font-size: 0.85rem; color: #ccc; }
        .thumb { width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; background: #000; margin-bottom: 0.5rem; }
        .skeleton {
            height: 120px;
            border-radius: 12px;
            background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            margin-top: 1rem;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal.open { display: flex; }
        .modal-box {
            background: #121212;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.25rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .bar { height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin: 0.75rem 0; }
        .bar > i { display: block; height: 100%; width: 0%; background: #fff; transition: width 0.2s; }
        .err { color: #f88; font-size: 0.8rem; margin-top: 0.75rem; }
        .link-row { margin-top: 0.35rem; }
        .link-row a { color: #8af; font-size: 0.72rem; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Threads Media Downloader</h1>
    <p class="sub">Hosted on Cloudflare · public posts only</p>
    <p class="privacy">Post URLs are sent to our server to resolve media links.</p>

    <label for="postUrl">Thread link</label>
    <input type="text" id="postUrl" placeholder="https://www.threads.com/@user/post/ABC123" autocomplete="off" />
    <div id="turnstile"></div>
    <button type="button" class="btn" id="loadBtn">Load media</button>
    <div id="skeleton" class="skeleton" style="display:none"></div>
    <p id="error" class="err" style="display:none"></p>
    <div id="results"></div>
</div>

<div class="modal" id="dlModal" aria-hidden="true">
    <div class="modal-box">
        <p id="dlTitle">Downloading...</p>
        <div class="bar"><i id="dlBar"></i></div>
        <p id="dlLabel" style="font-size:0.75rem;color:#888">Do not close this tab</p>
    </div>
</div>

<script>
window.TURNSTILE_SITE_KEY = '';
window.__appConfigPromise = fetch('/api/config', { credentials: 'same-origin' })
  .then((r) => r.json())
  .then((cfg) => {
    if (cfg.turnstileSiteKey) window.TURNSTILE_SITE_KEY = cfg.turnstileSiteKey;
    return cfg;
  })
  .catch(() => ({ turnstileSiteKey: '' }));
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script type="module" src="./app.js"></script>
</body>
</html>
